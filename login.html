<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In / Sign Up — Yogorise</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&display=swap');

    :root{
      --ivory:#FAF6EF;
      --ivory-deep:#F3EDE0;
      --sage:#8B9A7D;
      --sage-600:#748568;
      --sage-deep:#47563F;
      --sage-dark:#333F2D;
      --sage-darker:#242D20;
      --gold:#C99A44;
      --gold-soft:#E4C989;
      --clay:#B9805C;
      --ink:#3A362F;
      --ink-soft:#726C5E;
    }

    html{ scroll-behavior:smooth; }
    body{
      font-family:'Plus Jakarta Sans', sans-serif;
      background:var(--ivory);
      color:var(--ink);
    }
    .font-display{ font-family:'Fraunces', serif; }

    .blob{
      position:absolute; border-radius:9999px; filter:blur(60px);
      opacity:.35; pointer-events:none; will-change:transform;
      animation:drift 22s ease-in-out infinite;
    }
    .blob.two{ animation-duration:28s; animation-delay:-6s; }
    .blob.three{ animation-duration:34s; animation-delay:-14s; }
    @keyframes drift{
      0%,100%{ transform:translate(0,0) scale(1); }
      33%{ transform:translate(30px,-24px) scale(1.08); }
      66%{ transform:translate(-24px,18px) scale(.96); }
    }

    @media (prefers-reduced-motion: reduce){
      .blob{ animation:none; }
    }

    a:focus-visible, button:focus-visible, input:focus-visible{
      outline:2px solid var(--gold); outline-offset:2px;
    }

    .field-input{
      width:100%; padding:.85rem 1rem .85rem 2.75rem; border-radius:.9rem;
      border:1px solid rgba(71,86,63,.18); background:#fff;
      font-size:.95rem; color:var(--ink); transition:border-color .2s ease, box-shadow .2s ease;
    }
    .field-input:focus{
      border-color:var(--sage); box-shadow:0 0 0 4px rgba(139,154,125,.15); outline:none;
    }
    .field-icon{
      position:absolute; left:1rem; top:50%; transform:translateY(-50%);
      color:var(--ink-soft); font-size:.9rem; pointer-events:none;
    }
    .spinner{
      width:16px; height:16px; border-radius:9999px;
      border:2px solid rgba(255,255,255,.4); border-top-color:#fff;
      animation:spin .7s linear infinite;
    }
    @keyframes spin{ to{ transform:rotate(360deg); } }

    .auth-tab{
      flex:1; text-align:center; padding:.7rem .5rem; border-radius:9999px;
      font-size:.85rem; font-weight:600; color:var(--ink-soft);
      transition:background .2s ease, color .2s ease; cursor:pointer;
    }
    .auth-tab.active{ background:var(--sage-deep); color:#fff; }
  </style>
</head>
<body class="antialiased">

  <!-- ambient background -->
  <div class="fixed inset-0 overflow-hidden -z-10" style="background:linear-gradient(180deg, var(--ivory-deep) 0%, var(--ivory) 55%, var(--ivory) 100%);">
    <div class="blob w-72 h-72 -top-10 -left-10" style="background:var(--sage);"></div>
    <div class="blob two w-96 h-96 top-20 right-0" style="background:var(--gold-soft);"></div>
    <div class="blob three w-64 h-64 bottom-0 left-1/3" style="background:var(--clay);"></div>
  </div>

  <div class="min-h-screen flex flex-col">

    <!-- Simple top bar -->
    <div class="px-4 sm:px-6 lg:px-8 pt-8">
      <a href="index.html" class="inline-flex items-center gap-3">
        <div class="w-10 h-10 rounded-full flex items-center justify-center text-white text-lg" style="background:linear-gradient(135deg, var(--sage), var(--sage-deep));">
          <i class="fa-solid fa-spa"></i>
        </div>
        <span class="text-2xl font-display font-semibold tracking-tight" style="color:var(--ink);">Yogo<span style="color:var(--sage-deep);" class="italic">rise</span></span>
      </a>
    </div>

    <!-- Login card -->
    <div class="flex-1 flex items-center justify-center px-4 py-12">
      <div class="w-full max-w-md">
        <div class="bg-white rounded-3xl shadow-xl border p-8 sm:p-10" style="border-color:rgba(71,86,63,.12);">

          <div class="text-center mb-7">
            <div class="w-14 h-14 mx-auto mb-5 rounded-full flex items-center justify-center text-white text-xl" style="background:linear-gradient(135deg, var(--sage), var(--sage-deep)); box-shadow:0 10px 26px rgba(71,86,63,.25);">
              <i class="fa-solid fa-user-lock"></i>
            </div>
            <h1 id="auth-title" class="text-2xl sm:text-3xl font-display font-medium" style="color:var(--ink);">Welcome back</h1>
            <p id="auth-subtitle" class="text-sm mt-2" style="color:var(--ink-soft);">Log in to manage the Yogorise Journal.</p>
          </div>

          <!-- Tab switcher -->
          <div class="flex gap-1 p-1 rounded-full mb-7" style="background:var(--ivory-deep);">
            <div id="tab-login" class="auth-tab active" data-tab="login">Log In</div>
            <div id="tab-signup" class="auth-tab" data-tab="signup">Sign Up</div>
          </div>

          <div id="form-error" class="hidden mb-5 px-4 py-3 rounded-xl text-sm font-medium flex items-start gap-2" style="background:#FBEDEA; color:#9C4A2F;">
            <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
            <span id="form-error-text">Something went wrong.</span>
          </div>

          <div id="form-success" class="hidden mb-5 px-4 py-3 rounded-xl text-sm font-medium flex items-start gap-2" style="background:#EEF3E9; color:var(--sage-deep);">
            <i class="fa-solid fa-circle-check mt-0.5"></i>
            <span id="form-success-text">Success.</span>
          </div>

          <!-- Log In form -->
          <form id="login-form" class="space-y-5">
            <div>
              <label for="email" class="block text-xs font-semibold uppercase tracking-wider mb-2" style="color:var(--ink-soft);">Email</label>
              <div class="relative">
                <i class="fa-regular fa-envelope field-icon"></i>
                <input id="email" type="email" required autocomplete="email" placeholder="you@yogorise.com" class="field-input">
              </div>
            </div>

            <div>
              <div class="flex items-center justify-between mb-2">
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider" style="color:var(--ink-soft);">Password</label>
                <button type="button" id="forgot-link" class="text-xs font-semibold hover:opacity-70 transition" style="color:var(--sage-deep);">Forgot password?</button>
              </div>
              <div class="relative">
                <i class="fa-solid fa-lock field-icon"></i>
                <input id="password" type="password" required autocomplete="current-password" placeholder="••••••••" class="field-input">
                <button type="button" id="toggle-password" tabindex="-1" class="absolute right-4 top-1/2 -translate-y-1/2 text-sm" style="color:var(--ink-soft);">
                  <i class="fa-regular fa-eye"></i>
                </button>
              </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full flex items-center justify-center gap-2 px-5 py-3.5 text-white rounded-full font-semibold text-sm shadow-md transition hover:-translate-y-0.5" style="background:var(--sage-deep);">
              <span id="submit-label">Log In</span>
            </button>
          </form>

          <!-- Sign Up form -->
          <form id="signup-form" class="space-y-5 hidden">
            <div>
              <label for="su-name" class="block text-xs font-semibold uppercase tracking-wider mb-2" style="color:var(--ink-soft);">Full Name</label>
              <div class="relative">
                <i class="fa-regular fa-user field-icon"></i>
                <input id="su-name" type="text" required autocomplete="name" placeholder="Jane Doe" class="field-input">
              </div>
            </div>

            <div>
              <label for="su-email" class="block text-xs font-semibold uppercase tracking-wider mb-2" style="color:var(--ink-soft);">Email</label>
              <div class="relative">
                <i class="fa-regular fa-envelope field-icon"></i>
                <input id="su-email" type="email" required autocomplete="email" placeholder="you@yogorise.com" class="field-input">
              </div>
            </div>

            <div>
              <label for="su-password" class="block text-xs font-semibold uppercase tracking-wider mb-2" style="color:var(--ink-soft);">Password</label>
              <div class="relative">
                <i class="fa-solid fa-lock field-icon"></i>
                <input id="su-password" type="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters" class="field-input">
                <button type="button" id="toggle-su-password" tabindex="-1" class="absolute right-4 top-1/2 -translate-y-1/2 text-sm" style="color:var(--ink-soft);">
                  <i class="fa-regular fa-eye"></i>
                </button>
              </div>
            </div>

            <div>
              <label for="su-password-confirm" class="block text-xs font-semibold uppercase tracking-wider mb-2" style="color:var(--ink-soft);">Confirm Password</label>
              <div class="relative">
                <i class="fa-solid fa-lock field-icon"></i>
                <input id="su-password-confirm" type="password" required minlength="6" autocomplete="new-password" placeholder="Re-enter password" class="field-input">
              </div>
            </div>

            <button type="submit" id="signup-submit-btn" class="w-full flex items-center justify-center gap-2 px-5 py-3.5 text-white rounded-full font-semibold text-sm shadow-md transition hover:-translate-y-0.5" style="background:var(--sage-deep);">
              <span id="signup-submit-label">Create Account</span>
            </button>
          </form>

          <p class="text-center text-xs mt-7" style="color:var(--ink-soft);">
            <a href="index.html" class="font-semibold hover:opacity-70 transition" style="color:var(--sage-deep);"><i class="fa-solid fa-arrow-left-long mr-1"></i> Back to Yogorise</a>
          </p>
        </div>

        <p id="auth-footnote" class="text-center text-xs mt-6" style="color:var(--ink-soft);">
          Access is limited to Yogorise team members. Contact an administrator if you need an account.
        </p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const emailEl = document.getElementById('email');
    const passwordEl = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');
    const submitLabel = document.getElementById('submit-label');
    const errorBox = document.getElementById('form-error');
    const errorText = document.getElementById('form-error-text');
    const successBox = document.getElementById('form-success');
    const successText = document.getElementById('form-success-text');

    const signupForm = document.getElementById('signup-form');
    const suName = document.getElementById('su-name');
    const suEmail = document.getElementById('su-email');
    const suPassword = document.getElementById('su-password');
    const suPasswordConfirm = document.getElementById('su-password-confirm');
    const signupBtn = document.getElementById('signup-submit-btn');
    const signupLabel = document.getElementById('signup-submit-label');

    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const authTitle = document.getElementById('auth-title');
    const authSubtitle = document.getElementById('auth-subtitle');
    const authFootnote = document.getElementById('auth-footnote');

    function showError(msg){
      successBox.classList.add('hidden');
      errorText.textContent = msg;
      errorBox.classList.remove('hidden');
    }
    function showSuccess(msg){
      errorBox.classList.add('hidden');
      successText.textContent = msg;
      successBox.classList.remove('hidden');
    }
    function clearMessages(){
      errorBox.classList.add('hidden');
      successBox.classList.add('hidden');
    }
    function setLoading(loading){
      submitBtn.disabled = loading;
      submitBtn.style.opacity = loading ? '.75' : '1';
      submitLabel.innerHTML = loading ? '<span class="spinner"></span>' : 'Log In';
    }
    function setSignupLoading(loading){
      signupBtn.disabled = loading;
      signupBtn.style.opacity = loading ? '.75' : '1';
      signupLabel.innerHTML = loading ? '<span class="spinner"></span>' : 'Create Account';
    }

    function switchTab(tab){
      clearMessages();
      const isLogin = tab === 'login';
      tabLogin.classList.toggle('active', isLogin);
      tabSignup.classList.toggle('active', !isLogin);
      form.classList.toggle('hidden', !isLogin);
      signupForm.classList.toggle('hidden', isLogin);
      if (isLogin){
        authTitle.textContent = 'Welcome back';
        authSubtitle.textContent = 'Log in to manage the Yogorise Journal.';
        authFootnote.textContent = 'Access is limited to Yogorise team members. Contact an administrator if you need an account.';
      } else {
        authTitle.textContent = 'Create your account';
        authSubtitle.textContent = 'Sign up to start writing for the Yogorise Journal.';
        authFootnote.textContent = 'New accounts may need admin approval before publishing access is granted.';
      }
    }
    tabLogin.addEventListener('click', () => switchTab('login'));
    tabSignup.addEventListener('click', () => switchTab('signup'));

    // If already logged in, go straight to admin
    (async function checkSession(){
      try{
        const { data } = await supabaseClient.auth.getSession();
        if (data && data.session){
          window.location.href = 'admin.html';
        }
      } catch(e){ /* supabaseClient may not be ready yet — ignore */ }
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      successBox.classList.add('hidden');

      const email = emailEl.value.trim();
      const password = passwordEl.value;
      if (!email || !password){
        showError('Please enter both email and password.');
        return;
      }

      setLoading(true);
      try{
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        showSuccess('Logged in — redirecting…');
        setTimeout(() => { window.location.href = 'admin.html'; }, 600);
      } catch(err){
        console.error('Login failed:', err);
        showError(err.message || 'Invalid email or password. Please try again.');
      } finally {
        setLoading(false);
      }
    });

    document.getElementById('toggle-password').addEventListener('click', () => {
      const icon = document.querySelector('#toggle-password i');
      const isPw = passwordEl.type === 'password';
      passwordEl.type = isPw ? 'text' : 'password';
      icon.classList.toggle('fa-eye');
      icon.classList.toggle('fa-eye-slash');
    });

    document.getElementById('toggle-su-password').addEventListener('click', () => {
      const icon = document.querySelector('#toggle-su-password i');
      const isPw = suPassword.type === 'password';
      suPassword.type = isPw ? 'text' : 'password';
      icon.classList.toggle('fa-eye');
      icon.classList.toggle('fa-eye-slash');
    });

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessages();

      const name = suName.value.trim();
      const email = suEmail.value.trim();
      const password = suPassword.value;
      const confirm = suPasswordConfirm.value;

      if (!name || !email || !password || !confirm){
        showError('Please fill in all fields.');
        return;
      }
      if (password.length < 6){
        showError('Password must be at least 6 characters.');
        return;
      }
      if (password !== confirm){
        showError('Passwords do not match.');
        return;
      }

      setSignupLoading(true);
      try{
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: { data: { full_name: name } }
        });
        if (error) throw error;

        if (data && data.session){
          showSuccess('Account created — redirecting…');
          setTimeout(() => { window.location.href = 'admin.html'; }, 800);
        } else {
          showSuccess('Account created! Please check your email to confirm before logging in.');
          signupForm.reset();
        }
      } catch(err){
        console.error('Sign up failed:', err);
        showError(err.message || 'Could not create account. Please try again.');
      } finally {
        setSignupLoading(false);
      }
    });

    document.getElementById('forgot-link').addEventListener('click', async () => {
      const email = emailEl.value.trim();
      if (!email){
        showError('Enter your email above first, then click "Forgot password?" to receive a reset link.');
        emailEl.focus();
        return;
      }
      try{
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
        if (error) throw error;
        showSuccess('Password reset link sent — check your inbox.');
      } catch(err){
        console.error('Reset failed:', err);
        showError(err.message || 'Could not send reset link. Please try again.');
      }
    });
  </script>

</body>
</html>
