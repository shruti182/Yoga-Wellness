<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yogorise Blog Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600&display=swap');
  :root{
    --ivory:#FAF6EF; --ivory-deep:#F3EDE0;
    --sage:#8B9A7D; --sage-deep:#47563F; --sage-darker:#242D20;
    --gold:#C99A44; --clay:#B9805C; --ink:#3A362F; --ink-soft:#726C5E;
  }
  body{ font-family:'Plus Jakarta Sans', sans-serif; background:var(--ivory); color:var(--ink); }
  .font-display{ font-family:'Fraunces', serif; }
  textarea, input{ font-family:'Plus Jakarta Sans', sans-serif; }
</style>
</head>
<body class="antialiased min-h-screen">

  <!-- Login screen -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm bg-white rounded-3xl border shadow-sm p-8" style="border-color:rgba(71,86,63,.12);">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-full flex items-center justify-center text-white" style="background:linear-gradient(135deg, var(--sage), var(--sage-deep));"><i class="fa-solid fa-spa"></i></div>
        <span class="text-xl font-display font-semibold">Yogorise <span style="color:var(--sage-deep);" class="italic">Admin</span></span>
      </div>
      <p class="text-sm mb-6" style="color:var(--ink-soft);">Log in with the account created in your Supabase dashboard to write and publish blog posts.</p>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider mb-1" style="color:var(--clay);">Email</label>
          <input id="login-email" type="email" required class="w-full px-4 py-2.5 rounded-xl border outline-none" style="border-color:rgba(71,86,63,.2);">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider mb-1" style="color:var(--clay);">Password</label>
          <input id="login-password" type="password" required class="w-full px-4 py-2.5 rounded-xl border outline-none" style="border-color:rgba(71,86,63,.2);">
        </div>
        <p id="login-error" class="hidden text-sm" style="color:#B4432E;"></p>
        <button type="submit" class="w-full py-3 rounded-full text-white font-semibold text-sm shadow-md transition hover:-translate-y-0.5" style="background:var(--sage-deep);">
          <span id="login-btn-text">Log In</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Admin dashboard -->
  <div id="dashboard" class="hidden">
    <nav class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b" style="border-color:rgba(71,86,63,.12);">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-sm" style="background:linear-gradient(135deg, var(--sage), var(--sage-deep));"><i class="fa-solid fa-spa"></i></div>
          <span class="text-lg font-display font-semibold">Yogorise <span style="color:var(--sage-deep);" class="italic">Admin</span></span>
        </div>
        <div class="flex items-center gap-4 text-sm">
          <a href="index.html" class="hover:opacity-70 transition" style="color:var(--ink-soft);"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>View site</a>
          <button id="logout-btn" class="px-4 py-2 rounded-full font-semibold text-xs" style="background:var(--ivory-deep); color:var(--ink);">Log Out</button>
        </div>
      </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10 grid lg:grid-cols-[1fr_1.3fr] gap-8">

      <!-- Post list -->
      <div>
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-display font-medium">Posts</h2>
          <button id="new-post-btn" class="px-4 py-2 rounded-full text-white font-semibold text-xs shadow-md" style="background:var(--sage-deep);"><i class="fa-solid fa-plus mr-1"></i>New Post</button>
        </div>
        <div id="posts-list" class="space-y-3"></div>
        <p id="posts-empty" class="hidden text-sm" style="color:var(--ink-soft);">No posts yet — create your first one.</p>
      </div>

      <!-- Editor -->
      <div class="bg-white rounded-3xl border shadow-sm p-6 sm:p-8 h-fit" style="border-color:rgba(71,86,63,.12);">
        <h2 id="editor-heading" class="text-xl font-display font-medium mb-5">New Post</h2>
        <form id="post-form" class="space-y-4">
          <input type="hidden" id="post-id">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider mb-1" style="color:var(--clay);">Title</label>
            <input id="post-title" required class="w-full px-4 py-2.5 rounded-xl border outline-none" style="border-color:rgba(71,86,63,.2);">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider mb-1" style="color:var(--clay);">Slug (URL-friendly, unique)</label>
            <input id="post-slug" required class="w-full px-4 py-2.5 rounded-xl border outline-none" style="border-color:rgba(71,86,63,.2);">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider mb-1" style="color:var(--clay);">Category</label>
              <input id="post-category" placeholder="Yoga Practice" class="w-full px-4 py-2.5 rounded-xl border outline-none" style="border-color:rgba(71,86,63,.2);">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider mb-1" style="color:var(--clay);">Read time</label>
              <input id="post-read-time" placeholder="5 min read" class="w-full px-4 py-2.5 rounded-xl border outline-none" style="border-color:rgba(71,86,63,.2);">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider mb-1" style="color:var(--clay);">Cover image URL</label>
            <input id="post-cover" placeholder="https://…" class="w-full px-4 py-2.5 rounded-xl border outline-none" style="border-color:rgba(71,86,63,.2);">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider mb-1" style="color:var(--clay);">Excerpt (short summary shown on cards)</label>
            <textarea id="post-excerpt" rows="2" required class="w-full px-4 py-2.5 rounded-xl border outline-none resize-y" style="border-color:rgba(71,86,63,.2);"></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider mb-1" style="color:var(--clay);">Content (HTML — used in the full article view)</label>
            <textarea id="post-content" rows="8" required class="w-full px-4 py-2.5 rounded-xl border outline-none resize-y font-mono text-sm" style="border-color:rgba(71,86,63,.2);" placeholder="<p>Your article body…</p>"></textarea>
          </div>
          <div class="flex items-center gap-6">
            <label class="flex items-center gap-2 text-sm font-semibold"><input type="checkbox" id="post-published" class="w-4 h-4"> Published</label>
            <label class="flex items-center gap-2 text-sm font-semibold"><input type="checkbox" id="post-featured" class="w-4 h-4"> Featured (hero slot)</label>
          </div>
          <p id="form-error" class="hidden text-sm" style="color:#B4432E;"></p>
          <div class="flex items-center gap-3 pt-2">
            <button type="submit" class="px-6 py-2.5 rounded-full text-white font-semibold text-sm shadow-md transition hover:-translate-y-0.5" style="background:var(--sage-deep);"><span id="save-btn-text">Save Post</span></button>
            <button type="button" id="cancel-edit-btn" class="hidden px-6 py-2.5 rounded-full font-semibold text-sm" style="background:var(--ivory-deep); color:var(--ink);">Cancel</button>
          </div>
        </form>
      </div>

    </div>
  </div>

<script>
  // ---------- auth ----------
  const loginScreen = document.getElementById('login-screen');
  const dashboard = document.getElementById('dashboard');

  async function checkSession(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session){
      loginScreen.classList.add('hidden');
      dashboard.classList.remove('hidden');
      loadPosts();
    } else {
      loginScreen.classList.remove('hidden');
      dashboard.classList.add('hidden');
    }
  }
  checkSession();

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('login-error');
    const btnText = document.getElementById('login-btn-text');
    errEl.classList.add('hidden');
    btnText.textContent = 'Logging in…';
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    btnText.textContent = 'Log In';
    if (error){
      errEl.textContent = error.message;
      errEl.classList.remove('hidden');
      return;
    }
    checkSession();
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    checkSession();
  });

  // ---------- posts ----------
  let allPosts = [];
  let editingId = null;

  function slugify(text){
    return text.toString().toLowerCase().trim()
      .replace(/[^\w\s-]/g, '')
      .replace(/[\s_-]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }
  document.getElementById('post-title').addEventListener('input', (e) => {
    if (!editingId) document.getElementById('post-slug').value = slugify(e.target.value);
  });

  async function loadPosts(){
    const { data, error } = await supabaseClient
      .from('blog_posts')
      .select('*')
      .order('created_at', { ascending: false });
    const listEl = document.getElementById('posts-list');
    const emptyEl = document.getElementById('posts-empty');
    if (error){
      listEl.innerHTML = `<p style="color:#B4432E;">${error.message}</p>`;
      return;
    }
    allPosts = data || [];
    if (allPosts.length === 0){
      listEl.innerHTML = '';
      emptyEl.classList.remove('hidden');
      return;
    }
    emptyEl.classList.add('hidden');
    listEl.innerHTML = allPosts.map(p => `
      <div class="bg-white rounded-2xl border p-4 flex items-start justify-between gap-3" style="border-color:rgba(71,86,63,.12);">
        <div class="min-w-0">
          <div class="flex items-center gap-2 mb-1">
            <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full ${p.published ? 'text-white' : ''}" style="${p.published ? 'background:var(--sage-deep);' : 'background:var(--ivory-deep); color:var(--ink-soft);'}">${p.published ? 'Published' : 'Draft'}</span>
            ${p.featured ? '<span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full" style="background:var(--gold); color:#3A362F;">Featured</span>' : ''}
          </div>
          <div class="font-semibold text-sm truncate">${p.title}</div>
          <div class="text-xs truncate" style="color:var(--ink-soft);">${p.category} · ${p.read_time}</div>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
          <button onclick="editPost('${p.id}')" class="w-8 h-8 rounded-full flex items-center justify-center text-sm" style="background:var(--ivory-deep);" title="Edit"><i class="fa-solid fa-pen"></i></button>
          <button onclick="deletePost('${p.id}')" class="w-8 h-8 rounded-full flex items-center justify-center text-sm" style="background:rgba(180,67,46,.1); color:#B4432E;" title="Delete"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
    `).join('');
  }

  function editPost(id){
    const p = allPosts.find(x => x.id === id);
    if (!p) return;
    editingId = id;
    document.getElementById('post-id').value = p.id;
    document.getElementById('post-title').value = p.title;
    document.getElementById('post-slug').value = p.slug;
    document.getElementById('post-category').value = p.category || '';
    document.getElementById('post-read-time').value = p.read_time || '';
    document.getElementById('post-cover').value = p.cover_image || '';
    document.getElementById('post-excerpt').value = p.excerpt || '';
    document.getElementById('post-content').value = p.content_html || '';
    document.getElementById('post-published').checked = !!p.published;
    document.getElementById('post-featured').checked = !!p.featured;
    document.getElementById('editor-heading').textContent = 'Edit Post';
    document.getElementById('save-btn-text').textContent = 'Update Post';
    document.getElementById('cancel-edit-btn').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function deletePost(id){
    if (!confirm('Delete this post? This cannot be undone.')) return;
    const { error } = await supabaseClient.from('blog_posts').delete().eq('id', id);
    if (error){ alert(error.message); return; }
    if (editingId === id) resetForm();
    loadPosts();
  }

  function resetForm(){
    editingId = null;
    document.getElementById('post-form').reset();
    document.getElementById('post-id').value = '';
    document.getElementById('editor-heading').textContent = 'New Post';
    document.getElementById('save-btn-text').textContent = 'Save Post';
    document.getElementById('cancel-edit-btn').classList.add('hidden');
    document.getElementById('form-error').classList.add('hidden');
  }
  document.getElementById('cancel-edit-btn').addEventListener('click', resetForm);
  document.getElementById('new-post-btn').addEventListener('click', resetForm);

  document.getElementById('post-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('form-error');
    errEl.classList.add('hidden');

    const payload = {
      title: document.getElementById('post-title').value.trim(),
      slug: document.getElementById('post-slug').value.trim(),
      category: document.getElementById('post-category').value.trim() || 'Yoga Practice',
      read_time: document.getElementById('post-read-time').value.trim() || '5 min read',
      cover_image: document.getElementById('post-cover').value.trim() || null,
      excerpt: document.getElementById('post-excerpt').value.trim(),
      content_html: document.getElementById('post-content').value,
      published: document.getElementById('post-published').checked,
      featured: document.getElementById('post-featured').checked,
    };

    let error;
    if (editingId){
      ({ error } = await supabaseClient.from('blog_posts').update(payload).eq('id', editingId));
    } else {
      ({ error } = await supabaseClient.from('blog_posts').insert(payload));
    }

    if (error){
      errEl.textContent = error.message;
      errEl.classList.remove('hidden');
      return;
    }
    resetForm();
    loadPosts();
  });
</script>
</body>
</html>
